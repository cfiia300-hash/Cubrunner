name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web app
        run: |
          mkdir www
          cp runner.html www/index.html
      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Куб-раннер" com.cfii.cuberunner --web-dir www
          npx cap add android
      - name: Generate icons
        run: |
          mkdir assets
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npm install @capacitor/assets@3
          npx capacitor-assets generate --android
      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: runner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
